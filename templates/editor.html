{% extends "base.html" %}
{% block content %}
  <form class="panel" method="post">
    <h1>{{ title }}</h1>
    <label>Title<input name="title" value="{{ post['title'] if post else '' }}" required></label>
    <label>Body<textarea name="body" rows="12" required>{{ post['body'] if post else '' }}</textarea></label>
    <button>Save post</button>
  </form>
{% endblock %}
